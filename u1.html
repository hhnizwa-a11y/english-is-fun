<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<title>English Unit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Baloo+Bhaijaan+2:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#23314f;--soft:#5d6b8a;--paper:#fffdf6;--a:#ff7a3d;--b:#e8479b;--c:#2f8fe6;--ok:#2fb36b;--no:#e5484d;--sun:#ffc93c;--accent:var(--a)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#17223b;font-family:"Baloo 2","Baloo Bhaijaan 2",system-ui,sans-serif;color:var(--ink)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;touch-action:manipulation}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:0 0;background:var(--paper);overflow:hidden;border-radius:28px}
.slide{position:absolute;inset:0;padding:88px 80px 112px;display:none;flex-direction:column;overflow:hidden}
.slide.on{display:flex}
.slide.on>h1,.slide.on>.body{animation:in .5s cubic-bezier(.2,.8,.2,1) both}
.slide.on>.body{animation-delay:.08s}
@keyframes in{from{opacity:0;transform:translateY(30px) scale(.97)}to{opacity:1;transform:none}}
.slide[data-part="a"]{--accent:var(--a);background:linear-gradient(#fff8ef,#ffe7d2)}
.slide[data-part="b"]{--accent:var(--b);background:linear-gradient(#fff6fb,#ffdff0)}
.slide[data-part="c"]{--accent:var(--c);background:linear-gradient(#f3faff,#d8eeff)}
.slide>*{position:relative;z-index:1}
.amb{position:absolute!important;inset:0;z-index:0!important;pointer-events:none;overflow:hidden}
.amb i{position:absolute;top:0;font-style:normal;font-weight:800;opacity:.3;animation:rise linear infinite}
@keyframes rise{from{transform:translateY(960px) rotate(-20deg)}50%{transform:translateY(400px) translateX(40px) rotate(20deg)}to{transform:translateY(-140px) rotate(-20deg)}}

/* bars */
#bar{position:absolute;left:0;right:0;top:0;height:74px;display:flex;align-items:center;gap:14px;padding:0 30px;z-index:6}
#bar .unit{font-weight:800;font-size:25px;background:var(--ink);color:#fff;padding:3px 20px;border-radius:99px}
#partLbl{font-weight:700;font-size:23px;color:var(--soft)}
#bar .ib{width:52px;height:52px;border-radius:50%;background:#fff;border:3px solid var(--ink);font-size:24px;transition:transform .15s}
#bar .ib:hover{transform:scale(1.12) rotate(-6deg)}
#stars{margin-left:auto;font-weight:800;font-size:28px;background:#fff3c9;border:3px solid var(--sun);padding:1px 20px;border-radius:99px;transition:transform .25s}
#stars.pop{transform:scale(1.3) rotate(-5deg)}
#nav{position:absolute;left:50%;transform:translateX(-50%);bottom:14px;height:70px;display:flex;align-items:center;gap:18px;z-index:6}
.navb{width:64px;height:64px;border-radius:50%;background:var(--ink);color:#fff;font-size:32px;font-weight:800;transition:transform .15s}
.navb:hover{transform:scale(1.1)}.navb:disabled{opacity:.25;transform:none;cursor:default}
.navb.hint{animation:pulse .7s infinite;background:var(--ok)}
#pbar{width:380px;height:16px;border-radius:9px;background:#d6dbe8;position:relative}
#pfill{position:absolute;inset:0 auto 0 0;border-radius:9px;background:var(--ink);transition:width .4s}
#pbus{position:absolute;top:-30px;font-size:34px;transition:left .4s;transform:translateX(-50%) scaleX(-1);animation:bob2 .6s infinite alternate}
@keyframes bob2{to{margin-top:-5px}}
#pnum{font-weight:800;font-size:22px;color:var(--soft);min-width:70px}

/* mascot */
#pip{position:absolute;left:18px;bottom:6px;width:104px;z-index:7;animation:bob 2.4s ease-in-out infinite;transform-origin:50% 100%;cursor:pointer}
#pip .eyes{animation:blink 4s infinite;transform-origin:60px 72px}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
#pip.yay{animation:yay .7s}#pip.oops{animation:shake .4s}
@keyframes yay{30%{transform:translateY(-70px) rotate(-18deg) scale(1.1)}60%{transform:translateY(-20px) rotate(14deg)}}
#bub{position:absolute;left:128px;bottom:26px;max-width:336px;background:#fff;border:3px solid var(--ink);border-radius:20px 20px 20px 4px;padding:6px 16px;font-family:"Baloo Bhaijaan 2";direction:rtl;font-size:22px;line-height:1.35;z-index:7;transition:transform .3s;transform-origin:0 100%}
#bub.new{animation:bubin .4s}@keyframes bubin{from{transform:scale(.3)}}

h1{font-size:56px;line-height:1.05;font-weight:800}
h1 em{font-style:normal;color:var(--accent)}
.body{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;margin-top:10px}
.tip{position:absolute!important;right:60px;top:86px;max-width:440px;background:#fff8dc;border:4px solid var(--sun);border-radius:22px;padding:10px 20px;font-size:25px;font-weight:700;line-height:1.3;z-index:3!important;animation:tipw 3s ease-in-out infinite;transform-origin:100% 0}
@keyframes tipw{50%{transform:rotate(-1.5deg)}}
.tip b{color:var(--accent)}

/* emoji motion */
.e{display:inline-block;font-style:normal;line-height:1.1}
@keyframes bob{50%{transform:translateY(-14px)}}
@keyframes pulse{50%{transform:scale(1.14)}}
@keyframes wig{25%{transform:rotate(-7deg) scale(1.08)}60%{transform:rotate(6deg) scale(1.08)}}
@keyframes shake{25%{transform:translateX(-12px)}75%{transform:translateX(12px)}}
.a-bob{animation:bob 2s ease-in-out infinite}
.a-pulse{animation:pulse 1s ease-in-out infinite}
.a-wave{animation:wave .7s ease-in-out infinite alternate;transform-origin:70% 80%}@keyframes wave{from{transform:rotate(-22deg)}to{transform:rotate(24deg)}}
.a-flip{animation:flip 1.4s ease-in-out infinite}@keyframes flip{50%{transform:scaleX(.55) rotate(-4deg)}}
.a-write{animation:wr 1.6s linear infinite}@keyframes wr{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(20px,-12px) rotate(8deg)}50%{transform:translate(40px,8px) rotate(-4deg)}75%{transform:translate(60px,-12px) rotate(8deg)}100%{transform:translate(0,0)}}
.a-dance{animation:dn .5s ease-in-out infinite alternate}@keyframes dn{from{transform:rotate(-14deg) translateY(0)}to{transform:rotate(14deg) translateY(-18px)}}
.a-bounce{animation:bn .55s cubic-bezier(.3,0,.7,1) infinite alternate}@keyframes bn{from{transform:translateY(-110px)}to{transform:translateY(20px) scaleY(.85)}}
.a-spin{animation:spin 9s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.a-swing{animation:sw 1.3s ease-in-out infinite alternate;transform-origin:50% 0}@keyframes sw{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
.a-fly{animation:fly 3s ease-in-out infinite}@keyframes fly{0%,100%{transform:translate(-90px,10px) rotate(-8deg)}50%{transform:translate(90px,-50px) rotate(10deg) scaleX(-1)}}
.a-drive{animation:drv 3.4s linear infinite}@keyframes drv{from{transform:translateX(-520px) scaleX(-1)}to{transform:translateX(180px) scaleX(-1)}}
.a-peek{animation:pk 1.6s ease-in-out infinite alternate}@keyframes pk{from{transform:translateY(40px) scale(.8)}to{transform:translateY(-12px)}}
.a-sleep{animation:zz 2.4s ease-in-out infinite}@keyframes zz{50%{transform:scale(1.06,.94)}}
.a-walk{animation:wk 2.6s ease-in-out infinite alternate}@keyframes wk{from{transform:translateX(-60px)}to{transform:translateX(60px)}}
.cnt{display:inline-flex;gap:14px;font-weight:800}
.cnt i{font-style:normal;font-size:.9em;color:#fff;background:var(--c);width:1.25em;height:1.25em;border-radius:24%;display:flex;align-items:center;justify-content:center;animation:popn 1.8s infinite}
.cnt i:nth-child(2){background:var(--b);animation-delay:.5s}.cnt i:nth-child(3){background:var(--a);animation-delay:1s}
@keyframes popn{0%,100%{transform:scale(.45);opacity:.35}25%{transform:scale(1.2) rotate(-8deg);opacity:1}60%{transform:scale(1)}}
.sing{position:relative;display:inline-block}
.sing i{position:absolute;left:60%;top:0;font-size:.45em;font-style:normal;animation:note 1.8s linear infinite}
.sing i+i{animation-delay:.9s;left:20%}
@keyframes note{from{transform:translate(0,20px);opacity:0}30%{opacity:1}to{transform:translate(50px,-110px) rotate(25deg);opacity:0}}

/* title */
#s0{padding:0;background:linear-gradient(#aee0ff 0 60%,#8fd66a 60%);align-items:center;justify-content:center;text-align:center}
#s0 .sun{position:absolute;top:60px;right:140px;width:140px;height:140px;border-radius:50%;background:var(--sun);box-shadow:0 0 0 24px #ffc93c55,0 0 0 52px #ffc93c22;animation:pulse 3s infinite}
.cloud{position:absolute!important;font-size:120px;animation:drift 24s linear infinite}
@keyframes drift{from{transform:translateX(-300px)}to{transform:translateX(1800px)}}
#s0 .bird{position:absolute;top:150px;font-size:54px;animation:drift 13s linear infinite,bob 1s infinite}
#s0 .bus{position:absolute;bottom:14px;font-size:120px;animation:busr 9s linear infinite}
@keyframes busr{from{transform:translateX(-300px) scaleX(-1)}to{transform:translateX(1800px) scaleX(-1)}}
#s0 .school{font-size:170px;line-height:1;animation:bob 3s ease-in-out infinite}
#s0 h1{font-size:128px;color:#fff;-webkit-text-stroke:10px var(--ink);paint-order:stroke fill;letter-spacing:3px}
#s0 h1 span{display:inline-block;animation:letter 1.6s ease-in-out infinite}
@keyframes letter{50%{transform:translateY(-20px) rotate(-6deg)}}
#s0 .tag{font-size:32px;font-weight:700;background:#fff;padding:4px 30px;border-radius:99px;display:inline-block}
.namebox{margin-top:16px;display:flex;gap:14px;align-items:center;justify-content:center;font-size:32px;font-weight:800}
.namebox input{width:330px;font-size:36px;font-weight:800;text-align:center;border:5px solid var(--ink);border-radius:20px;padding:4px 10px;background:#fff;outline:none;color:var(--b)}
.namebox input:focus{border-color:var(--b)}
#nmNote{height:34px;font-size:24px;font-weight:700;color:var(--ink)}
.go{margin-top:6px;font-size:38px;font-weight:800;color:#fff;background:var(--a);padding:10px 56px;border-radius:99px;box-shadow:0 8px 0 #c9521d;transition:transform .1s,box-shadow .1s;animation:pulse 1.4s infinite}
.go:active{transform:translateY(6px);box-shadow:0 2px 0 #c9521d}

/* map */
.map{position:relative;width:1460px;height:600px;flex:none;zoom:.92}
.map svg{position:absolute;inset:0}
.map .road{fill:none;stroke:#8d99b5;stroke-width:46;stroke-linecap:round}
.map .dash{fill:none;stroke:#fff;stroke-width:6;stroke-dasharray:26 26;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-52}}
.map .mbus{position:absolute;left:0;top:0;font-size:70px;offset-path:path("M40 520 C160 520 200 440 300 420 C460 390 520 250 700 250 C880 250 900 440 1080 430 C1240 420 1300 260 1400 180");offset-rotate:0deg;animation:ride 12s linear infinite}
.map .mbus span{display:inline-block;transform:scaleX(-1)}
@keyframes ride{from{offset-distance:0%}to{offset-distance:100%}}
.stn{position:absolute;transform:translate(-50%,-50%);text-align:center;width:300px}
.stn b{display:flex;margin:0 auto;width:150px;height:150px;border-radius:50%;background:#fff;border:7px solid var(--k);align-items:center;justify-content:center;font-size:80px;box-shadow:0 10px 0 var(--k);animation:pulse 1.8s infinite;transition:transform .15s}
.stn:hover b{transform:scale(1.15) rotate(-6deg)}
.stn span{display:block;font-size:30px;font-weight:800;color:var(--k);margin-top:12px;background:#fff;border-radius:99px;padding:0 14px}
.stn small{font-family:"Baloo Bhaijaan 2";font-size:22px;color:var(--soft);direction:rtl;display:block}

/* cards */
.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:18px 22px;width:100%;padding:0 10px 10px}
.cards.four{grid-template-columns:repeat(4,1fr)}
.card{background:#fff;border:5px solid var(--ink);border-radius:28px;padding:14px 8px 12px;text-align:center;box-shadow:0 9px 0 var(--ink);transition:transform .12s,box-shadow .12s;position:relative;animation:cardin .5s both}
@keyframes cardin{from{opacity:0;transform:translateY(60px) rotate(8deg)}}
.card:hover{transform:translateY(-6px);box-shadow:0 15px 0 var(--ink)}
.card.hit{animation:wig .5s}.card.seen{background:#f2fff6;border-color:var(--ok);box-shadow:0 9px 0 var(--ok)}
.card .pic{font-size:92px;height:112px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.card .w{font-size:40px;font-weight:800;color:var(--accent);line-height:1.1}
.card .t{font-family:"Baloo Bhaijaan 2";font-size:22px;color:var(--soft);direction:rtl}
.card::after{content:"🔊";position:absolute;top:8px;right:12px;font-size:22px;opacity:.5}

/* quiz */
.quiz{width:100%;display:flex;flex-direction:column;align-items:center;gap:24px}
.prompt{font-size:62px;font-weight:800;text-align:center;line-height:1.2;min-height:130px;display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap}
.prompt .gap{display:inline-block;min-width:150px;border-bottom:8px dashed var(--accent);color:var(--accent);padding:0 12px;animation:gapb 1s infinite alternate}
@keyframes gapb{to{border-color:var(--sun)}}
.prompt .row{flex-basis:100%;display:flex;justify-content:center;align-items:flex-end;gap:30px;min-height:150px}
.speak{width:130px;height:130px;border-radius:50%;background:var(--accent);font-size:66px;box-shadow:0 9px 0 #0003;animation:pulse 1.2s infinite}
.opts{display:flex;gap:24px;flex-wrap:wrap;justify-content:center}
.opt{font-size:46px;font-weight:800;background:#fff;border:5px solid var(--ink);border-radius:24px;padding:10px 44px;min-width:190px;box-shadow:0 8px 0 var(--ink);transition:transform .1s;animation:cardin .4s both}
.opt:nth-child(2){animation-delay:.07s}.opt:nth-child(3){animation-delay:.14s}.opt:nth-child(4){animation-delay:.21s}
.opt.pic{font-size:88px;padding:6px 30px}
.opt.long{font-size:36px;width:900px;text-align:left;padding:5px 40px}
.opts:has(.long){gap:14px}
.opt:hover{transform:translateY(-5px)}
.opt.ok{background:var(--ok);color:#fff;border-color:#1c7a47;box-shadow:0 8px 0 #1c7a47;animation:wig .5s}
.opt.no{background:#ffe1e2;border-color:var(--no);box-shadow:0 8px 0 var(--no);animation:shake .35s}
.prog{display:flex;gap:8px}
.prog i{width:46px;height:12px;border-radius:9px;background:#fff;border:2px solid #c8cfe0}
.prog i.d{background:var(--ok);border-color:var(--ok)}.prog i.c{background:var(--accent);border-color:var(--accent);animation:pulse .8s infinite}
.done{font-size:76px;font-weight:800;text-align:center;animation:wig .8s}
.done small{display:block;font-family:"Baloo Bhaijaan 2";font-size:32px;color:var(--soft);font-weight:700}
.again{font-size:28px;font-weight:800;background:var(--ink);color:#fff;border-radius:99px;padding:6px 32px}

/* balloons */
.sky{display:flex;gap:44px;justify-content:center;align-items:flex-start;height:290px;padding-top:20px}
.bal{width:176px;height:206px;border-radius:50% 50% 50% 50%/44% 44% 56% 56%;background:radial-gradient(circle at 32% 28%,#fff9,transparent 30%),hsl(var(--h) 84% 60%);font-size:78px;font-weight:800;color:#fff;position:relative;animation:balf 3s ease-in-out infinite alternate;box-shadow:inset -12px -16px 0 #0002}
.bal span{display:block;text-shadow:0 3px 0 #0003}
.bal::after{content:"";position:absolute;left:50%;top:100%;width:3px;height:74px;background:var(--ink);opacity:.5;transform-origin:0 0;animation:sw 1.5s ease-in-out infinite alternate}
@keyframes balf{from{transform:translateY(0) rotate(-5deg)}to{transform:translateY(-34px) rotate(5deg)}}
.bal.pop{animation:popA .4s forwards}@keyframes popA{40%{transform:scale(1.5)}to{transform:scale(2.2);opacity:0}}
.bal.away{animation:flyA 1.1s ease-in forwards}@keyframes flyA{to{transform:translateY(-760px) rotate(20deg);opacity:.2}}
.bal.wob{animation:shake .35s}

/* train */
.rail{position:relative;width:1420px;height:230px;overflow:hidden}
.rail::after{content:"";position:absolute;left:0;right:0;bottom:0;height:18px;background:repeating-linear-gradient(90deg,#8a5a2b 0 16px,transparent 16px 44px),linear-gradient(var(--ink),var(--ink)) 0 0/100% 6px no-repeat;animation:trk .5s linear infinite}
@keyframes trk{to{background-position:44px 0,0 0}}
.train{position:absolute;left:10px;bottom:16px;display:flex;align-items:flex-end;gap:6px;animation:chug .3s infinite alternate}
@keyframes chug{to{transform:translateY(-3px)}}
.rail.go .train{animation:choo 2s cubic-bezier(.6,0,.9,.4) forwards}@keyframes choo{to{transform:translateX(-1700px)}}
.rail.no .train{animation:shake .35s}
.loco{font-size:132px;line-height:1;position:relative}
.loco i{position:absolute;left:8px;top:-10px;font-size:40px;font-style:normal;animation:smoke 1.4s linear infinite}
.loco i+i{animation-delay:.7s}
@keyframes smoke{from{transform:translate(0,10px) scale(.4);opacity:.9}to{transform:translate(70px,-90px) scale(1.5);opacity:0}}
.car{background:var(--accent);color:#fff;font-size:44px;font-weight:800;padding:8px 24px;border-radius:16px 16px 6px 6px;margin-bottom:26px;position:relative;animation:cardin .3s both;box-shadow:inset 0 -8px 0 #0002}
.car::before,.car::after{content:"";position:absolute;bottom:-24px;width:26px;height:26px;border-radius:50%;background:#fff;border:6px dashed var(--ink);animation:spin 1s linear infinite}
.car::before{left:14px}.car::after{right:14px}
.rail.go .car{background:var(--ok)}
.chip{font-size:46px;font-weight:800;background:#fff;border:5px solid var(--ink);border-radius:20px;padding:4px 28px;box-shadow:0 7px 0 var(--ink);transition:transform .12s;animation:chipb 1.6s ease-in-out infinite}
.chip:nth-child(2n){animation-delay:-.5s}.chip:nth-child(3n){animation-delay:-1s}
@keyframes chipb{50%{transform:translateY(-7px) rotate(-2deg)}}
.chip.used{opacity:.15;pointer-events:none}

/* story */
.story{width:100%;display:flex;flex-direction:column;align-items:center;gap:14px}
.scene{width:1240px;height:380px;border-radius:36px;border:6px solid var(--ink);background:linear-gradient(#cfeeff 0 68%,#a8e08a 68%);display:flex;align-items:flex-end;justify-content:center;gap:34px;padding-bottom:36px;overflow:hidden;position:relative;animation:cardin .45s}
.scene .cloud{top:8px;font-size:70px;animation-duration:16s}
.cap{font-size:54px;font-weight:800;min-height:74px;text-align:center}
.cap span,.cline span{display:inline-block;transition:transform .15s,color .15s;margin:0 7px}
.cap span.hi,.cline span.hi{color:var(--accent);transform:translateY(-12px) scale(1.2)}
.ctl{display:flex;gap:18px;align-items:center;font-size:26px;font-weight:800;color:var(--soft)}
.ctl button{width:74px;height:74px;border-radius:50%;background:var(--accent);color:#fff;font-size:34px;box-shadow:0 6px 0 #0003}
.ctl button:disabled{opacity:.3}
.ctl .nx{animation:pulse 1s infinite}

/* chant */
.chant{display:flex;gap:40px;align-items:center;width:100%;justify-content:center}
.clines{display:flex;flex-direction:column;gap:6px}
.cline{font-size:44px;font-weight:800;padding:2px 24px;border-radius:18px;transition:background .2s,transform .2s;opacity:.55}
.cline.now{background:#fff;opacity:1;transform:scale(1.08);box-shadow:0 6px 0 var(--accent)}
.band{display:flex;flex-direction:column;align-items:center;gap:10px;font-size:110px}
.playb{font-size:34px;font-weight:800;color:#fff;background:var(--accent);padding:8px 40px;border-radius:99px;box-shadow:0 7px 0 #0003;animation:pulse 1.2s infinite}

/* alphabet */
.abc{display:grid;grid-template-columns:repeat(9,1fr);gap:14px;width:1360px}
.lt{height:128px;border-radius:22px;background:var(--c);color:#fff;font-size:76px;font-weight:800;box-shadow:0 7px 0 #1b62a8;animation:lwave 2.2s ease-in-out infinite;position:relative;line-height:1}
@keyframes lwave{50%{transform:translateY(-12px)}}
.lt.up{background:var(--b);box-shadow:0 7px 0 #a82a6c}
.lt small{position:absolute;right:6px;bottom:2px;font-size:30px}
.abcbar{font-size:40px;font-weight:800;height:60px;text-align:center}

/* room */
.roomwrap{display:flex;flex-direction:column;align-items:center;gap:8px}
.room{position:relative;width:1340px;height:470px;border-radius:30px;border:6px solid var(--ink);background:linear-gradient(#fdeccb 0 76%,#d9a56c 76%);overflow:hidden}
.obj{position:absolute;line-height:1;transition:transform .15s;animation:bob 3s ease-in-out infinite}
.obj:hover{transform:scale(1.08)}
.obj.act{animation:wig .6s}
.obj.found::after{content:attr(data-w);position:absolute;left:50%;top:-34px;transform:translateX(-50%);background:var(--ok);color:#fff;font-size:24px;font-weight:800;padding:0 14px;border-radius:99px;white-space:nowrap;line-height:1.5}
.obj[data-w="desk"]{padding-bottom:92px}.obj[data-w="desk"].found::after{top:40px}
.wb{width:340px;height:180px;background:#fff;border:9px solid #8d99b5;border-radius:12px;font-size:60px;font-weight:800;color:var(--c);display:flex;align-items:center;padding-left:26px}
.wb span{overflow:hidden;white-space:nowrap;animation:type 4s steps(7) infinite}
@keyframes type{from{width:0}70%,to{width:280px}}
.win{width:200px;height:170px;border:10px solid #fff;outline:5px solid var(--ink);background:linear-gradient(#8fd0ff,#d6f0ff);position:relative;overflow:hidden;border-radius:8px}
.win::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:8px;background:#fff;transform:translateX(-50%);z-index:2}
.win i{position:absolute;top:26px;font-style:normal;font-size:60px;animation:drift2 7s linear infinite}
@keyframes drift2{from{transform:translateX(-90px)}to{transform:translateX(220px)}}
.desk{width:330px;height:24px;background:#b97a3d;border-radius:6px;box-shadow:0 5px 0 #8a5a2b}
.desk::before,.desk::after{content:"";position:absolute;top:24px;width:16px;height:88px;background:#8a5a2b}
.desk::before{left:18px}.desk::after{right:18px}
.pcase{width:120px;height:46px;border-radius:99px;background:#ff9cc6;border:5px solid var(--ink);font-size:26px;display:flex;align-items:center;justify-content:center}
.clock{position:absolute;left:1040px;top:34px;width:92px;height:92px;border-radius:50%;background:#fff;border:7px solid var(--ink)}
.clock::before,.clock::after{content:"";position:absolute;left:50%;bottom:50%;width:5px;margin-left:-2.5px;background:var(--ink);transform-origin:50% 100%;border-radius:3px}
.clock::before{height:32px;animation:spin 6s linear infinite}.clock::after{height:22px;background:var(--no);animation:spin 40s linear infinite}
.rbar{font-size:44px;font-weight:800;height:62px;display:flex;align-items:center;gap:18px}
.rbar b{color:var(--accent)}
.rbar .speak{width:62px;height:62px;font-size:30px;box-shadow:0 5px 0 #0003}

/* merge */
.merge{display:flex;align-items:center;justify-content:center;gap:40px;height:250px;position:relative;width:100%}
.mcard{background:#fff;border:5px solid var(--ink);border-radius:26px;padding:10px 34px;text-align:center;font-size:46px;font-weight:800;box-shadow:0 8px 0 var(--ink);transition:transform .7s cubic-bezier(.5,-.4,.3,1.4)}
.mcard .e{font-size:96px;display:block}
.andb{width:150px;height:150px;border-radius:50%;background:var(--sun);border:6px solid var(--ink);font-size:48px;font-weight:800;box-shadow:0 8px 0 var(--ink);animation:pulse .9s infinite;transition:transform .5s}
.merge.joined .mcard:first-child{transform:translateX(60px) rotate(-4deg)}
.merge.joined .mcard:last-child{transform:translateX(-60px) rotate(4deg)}
.merge.joined .andb{transform:scale(.7) rotate(360deg);animation:none}
.mres{font-size:56px;font-weight:800;min-height:80px;color:var(--ok)}

/* plural */
.plu{display:flex;flex-direction:column;align-items:center;gap:16px;width:100%}
.picks{display:flex;gap:14px}
.picks button{font-size:54px;width:92px;height:92px;border-radius:22px;background:#fff;border:5px solid var(--ink);box-shadow:0 6px 0 var(--ink);animation:chipb 1.8s infinite}
.picks button.sel{background:var(--sun)}
.things{height:170px;display:flex;gap:12px;align-items:flex-end;justify-content:center;font-size:110px}
.things .e{animation:cardin .3s both,bob 1.6s ease-in-out .3s infinite}
.psent{font-size:66px;font-weight:800}
.psent u{text-decoration:none;color:var(--accent)}
.psent .s{display:inline-block;color:var(--b);animation:pulse .6s infinite}
.pm{display:flex;gap:26px;align-items:center;font-size:40px;font-weight:800}
.pm button{width:96px;height:96px;border-radius:50%;background:var(--accent);color:#fff;font-size:60px;font-weight:800;box-shadow:0 7px 0 #0003;line-height:1}

/* wheel */
.wheelbox{display:flex;gap:70px;align-items:center}
.wheelwrap{position:relative;width:440px;height:440px}
.wheel{width:440px;height:440px;border-radius:50%;border:10px solid var(--ink);background:conic-gradient(#ff7a3d 0 60deg,#ffc93c 0 120deg,#2fb36b 0 180deg,#2f8fe6 0 240deg,#9b6bf2 0 300deg,#e8479b 0);transition:transform 3.2s cubic-bezier(.15,.8,.2,1);position:relative}
.wheel i{position:absolute;left:50%;top:50%;font-style:normal;font-size:70px;margin:-45px 0 0 -40px}
.wheelwrap::after{content:"▼";position:absolute;left:50%;top:-34px;transform:translateX(-50%);font-size:60px;color:var(--ink);animation:bob .8s infinite}
.wres{width:520px;text-align:center}
.wres .big{font-size:170px;height:210px;display:flex;align-items:center;justify-content:center}
.wres .word{font-size:80px;font-weight:800;color:var(--accent);line-height:1}
.wres p{font-size:34px;font-weight:700;color:var(--soft)}

/* poster */
.pwrap{display:flex;gap:26px;align-items:stretch}
.poster{position:relative;width:820px;height:520px;background:#fff;border:8px solid var(--ink);border-radius:20px;overflow:hidden;box-shadow:10px 10px 0 #0002}
.poster h2{text-align:center;font-size:56px;font-weight:800;background:linear-gradient(90deg,var(--a),var(--b),var(--c));-webkit-background-clip:text;background-clip:text;color:transparent;animation:pulse 2s infinite}
.poster .stk{position:absolute;font-size:84px;cursor:grab;user-select:none;touch-action:none;animation:sw 2s ease-in-out infinite alternate;line-height:1}
.poster .lines{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:30px;font-weight:800;color:var(--b);line-height:1.25;pointer-events:none}
.ppal{width:520px;display:flex;flex-direction:column;gap:12px}
.stks{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.stks button{font-size:50px;background:#fff;border:4px solid var(--ink);border-radius:16px;height:76px;animation:chipb 2s infinite}
.sents button{display:block;width:100%;font-size:26px;font-weight:800;background:#fff;border:4px solid var(--ink);border-radius:14px;padding:2px 14px;margin-bottom:8px;text-align:left}
.sents button.sel{background:var(--ok);color:#fff}


/* book references */
#refs{display:flex;gap:8px}
.rf{font-size:19px;font-weight:800;padding:1px 14px;border-radius:99px;border:3px solid #c8cfe0;color:#9aa4bb;background:#fff;white-space:nowrap;animation:cardin .4s both}
.rf.sb.on{border-color:#2f8fe6;background:#2f8fe6;color:#fff}.rf.ab.on{border-color:#2fb36b;background:#2fb36b;color:#fff}
/* ink: trace and draw */
.inkcap{font-size:40px;font-weight:800;display:flex;align-items:center;gap:14px}.inkcap b{color:var(--accent)}
.pad{position:relative;background:#fff linear-gradient(#bcd7f5 3px,transparent 3px) 0 232px/100% 400px no-repeat;border:6px solid var(--ink);border-radius:26px;overflow:hidden;flex:none}
.pad.free{background:#fff}
.guide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:200px;font-weight:800;color:#dbe2ef;letter-spacing:8px;pointer-events:none;animation:glow 1.6s ease-in-out infinite alternate}
@keyframes glow{to{color:#b9c6de}}
.pad canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.okb{font-size:30px;font-weight:800;background:#c8cfe0;color:#fff;border-radius:99px;padding:6px 36px}
.okb.ready{background:var(--ok);animation:pulse .8s infinite}
.dot{width:54px;height:54px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 3px var(--ink);animation:chipb 1.8s infinite}
.dot.sel{transform:scale(1.25);animation:none}
/* caps hunt */
.capline{font-size:88px;font-weight:800;display:flex;flex-wrap:wrap;justify-content:center;max-width:1400px;line-height:1.3}
.ch{font-size:88px;font-weight:800;padding:0 4px;border-radius:14px;animation:lwave 2.2s ease-in-out infinite}
.ch:nth-child(3n){animation-delay:-.7s}.ch:nth-child(3n+1){animation-delay:-1.4s}
.ch.hit{background:var(--ok);color:#fff;animation:wig .5s}.ch.no{animation:shake .35s;color:var(--no)}
.tpic{height:110px;display:flex;align-items:center}

/* toy: tap a state, the scene changes */
.toysc{position:relative;width:760px;height:300px;flex:none}
/* word search */
.wsbox{display:flex;gap:60px;align-items:center}
.wsgrid{display:grid;grid-template-columns:repeat(8,64px);gap:6px}
.wsgrid button{height:60px;border-radius:12px;background:#fff;border:3px solid #c8cfe0;font-size:38px;font-weight:800;line-height:1;animation:lwave 3s ease-in-out infinite}
.wsgrid button:nth-child(3n){animation-delay:-1s}.wsgrid button:nth-child(3n+1){animation-delay:-2s}
.wsgrid button.got{background:var(--ok);color:#fff;border-color:var(--ok);animation:wig .5s}
.wsgrid button.no{animation:shake .35s;border-color:var(--no)}
.wslist{display:flex;flex-direction:column;gap:4px;font-size:38px;font-weight:800}
.wslist span.got{color:var(--ok);text-decoration:line-through}

/* count toy + paint */
.cgrid{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:4px;max-width:820px}
.cnum{font-size:120px;font-weight:800;color:var(--accent);line-height:1;min-width:150px;text-align:center;animation:pulse 1.2s ease-in-out infinite}
.bfly{width:420px;height:300px;flex:none}
.bfly svg{width:100%;height:100%;overflow:visible;animation:flapw 1.1s ease-in-out infinite}
@keyframes flapw{50%{transform:scaleX(.84)}}
.bfly .z{fill:#fff;stroke:var(--ink);stroke-width:6;cursor:pointer;transition:fill .25s}
.bfly .bd{fill:var(--ink)}.bfly .an{fill:none;stroke:var(--ink);stroke-width:5;stroke-linecap:round}
/* self check + final */
.chk{display:flex;flex-direction:column;gap:16px;width:1100px}
.chk div{display:flex;align-items:center;justify-content:space-between;background:#fff;border:5px solid var(--ink);border-radius:26px;padding:2px 30px;font-size:42px;font-weight:800;animation:cardin .5s both}
.chk div:nth-child(2){animation-delay:.1s}.chk div:nth-child(3){animation-delay:.2s}
.chk button{font-size:58px;filter:grayscale(1);opacity:.5;transition:all .2s;animation:bob 1.8s infinite}
.chk button:nth-child(2){animation-delay:-.6s}.chk button:nth-child(3){animation-delay:-1.2s}
.chk button.sel{filter:none;opacity:1;transform:scale(1.35)}
#fx{position:absolute!important;inset:0;z-index:0!important}
.cert{background:#fffdf6ee;border:10px double var(--sun);border-radius:36px;padding:6px 80px;text-align:center;box-shadow:0 20px 60px #0005;animation:cardin .7s}
.cert .cup{font-size:96px;animation:bob 1.6s infinite;line-height:1.1}
.cert h2{font-size:44px;font-weight:800;color:var(--soft)}
.cert .nm{font-size:92px;font-weight:800;line-height:1.1;background:linear-gradient(90deg,var(--a),var(--b),var(--c));-webkit-background-clip:text;background-clip:text;color:transparent}
.cert p{font-size:40px;font-weight:800}
.cert .ar{font-family:"Baloo Bhaijaan 2";direction:rtl;font-size:30px;color:var(--soft)}
#stage.dark #pnum{color:#fff}#stage.dark .navb{background:#fff;color:var(--ink)}#stage.dark #pfill{background:var(--sun)}
#sF{background:radial-gradient(circle at 50% 40%,#2b3b66,#111a30)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}

count(s,body){const box=el('div','plu'),picks=el('div','picks'),things=el('div','things'),sent=el('div','psent'),pm=el('div','pm');body.append(box);
  const lo=s.lo||1,hi=s.hi||10;let k=0,n=lo;const seen=new Set();
  const draw=(spk=true)=>{const [e,one,many]=s.items[k];$$('button',picks).forEach((b,j)=>b.classList.toggle('sel',j===k));
    things.innerHTML=`<span class="cgrid">${E(e,'bob',n>10?52:n>5?70:96).repeat(n)}</span>`;$$('.e',things).forEach((x,j)=>x.style.animationDelay=-(j%5)*.2+'s');
    const w=n===1?one:many;sent.innerHTML=`I can see <u>${NW[n]}</u> ${w}.`;$('.cnum',pm).textContent=n;
    if(spk){say(`I can see ${NW[n]} ${w}.`);if(!seen.has(n)){seen.add(n);star(s.id+'-'+n);if(seen.size===hi-lo+1){pip('yay');sfx.win();$('#next').classList.add('hint')}}}};
  s.items.forEach(([e],j)=>{const b=el('button','',e);b.style.animationDelay=-j*.3+'s';b.onclick=()=>{k=j;sfx.tap();draw()};picks.append(b)});
  const mi=el('button','','−'),pl=el('button','','+');pm.append(mi,el('span','cnum',''),pl);
  mi.onclick=()=>{if(n>lo){n--;sfx.tap();draw()}};pl.onclick=()=>{if(n<hi){n++;sfx.pop();draw()}};
  box.append(picks,things,sent,pm);s.reset=()=>{k=0;n=lo;draw(false)};s.max=hi-lo+1},
paint(s,body){const box=el('div','quiz');body.append(box);let i=0;const tc=c=>c==='white'?'#9aa4bb':COLS[c];
  const draw=()=>{box.innerHTML='';if(i>=s.qs.length)return finish(box,s.reset);
    const [c1,c2]=s.qs[i];let cur=null,first=true;const fill=[null,null];
    const cap=el('div','inkcap',`${E('🖌️','swing',64)} A <b style="color:${tc(c1)}">${c1}</b> and <b style="color:${tc(c2)}">${c2}</b> butterfly`);
    const bf=el('div','bfly',`<svg viewBox="0 0 300 220"><path class="an" d="M146 62 C136 30 120 22 108 20 M154 62 C164 30 180 22 192 20"/>
      <path class="z" data-z="0" d="M150 100 C100 10 10 20 40 100 C55 130 120 120 150 110 Z"/><path class="z" data-z="0" d="M150 100 C200 10 290 20 260 100 C245 130 180 120 150 110 Z"/>
      <path class="z" data-z="1" d="M150 115 C110 125 50 130 60 180 C70 215 130 190 150 130 Z"/><path class="z" data-z="1" d="M150 115 C190 125 250 130 240 180 C230 215 170 190 150 130 Z"/>
      <ellipse class="bd" cx="150" cy="118" rx="11" ry="56"/></svg>`),pal=el('div','opts');
    Object.keys(COLS).forEach((c,j)=>{const b=el('button','dot');b.style.background=COLS[c];b.style.animationDelay=-j*.2+'s';b.dataset.c=c;b.setAttribute('aria-label',c);
      b.onclick=()=>{cur=c;sfx.tap();say(c);$$('.dot',pal).forEach(x=>x.classList.toggle('sel',x===b))};pal.append(b)});
    $$('.z',bf).forEach(z=>z.onclick=()=>{if(!cur){bad();return}const k=+z.dataset.z;fill[k]=cur;$$('.z',bf).filter(x=>+x.dataset.z===k).forEach(x=>x.style.fill=COLS[cur]);sfx.pop();
      if(fill[0]&&fill[1]){if((fill[0]===c1&&fill[1]===c2)||(fill[0]===c2&&fill[1]===c1)){if(first)star(s.id+'-'+i);good();say(`I can see a ${c1} and ${c2} butterfly.`);$$('.z',bf).forEach(x=>x.onclick=null);const my=TOK;setTimeout(()=>{if(my===TOK){i++;draw()}},2400)}
        else{first=false;bad()}}});
    const my=TOK;setTimeout(()=>my===TOK&&say(`Colour the butterfly ${c1} and ${c2}.`),450);
    box.append(cap,bf,pal,progress(s.qs.length,i))};
  s.reset=()=>{i=0;draw()};s.max=s.qs.length},
check(s,body){const box=el('div','chk');s.lines.forEach(t=>{const r=el('div','',`<span>${t}</span><span></span>`);
    ['😐','🙂','🤩'].forEach(f=>{const b=el('button','',f);b.onclick=()=>{$$('button',r).forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sfx.ok();pip('yay');if($$('.sel',box).length===3)$('#next').classList.add('hint')};r.lastChild.append(b)});box.append(r)});
  body.append(box);s.max=0}
};

/* ---------- special slides ---------- */
function title(s,node){
  node.innerHTML=`<div class="sun"></div><i class="cloud e" style="top:40px">☁️</i><i class="cloud e" style="top:170px;animation-delay:-12s;font-size:90px">☁️</i>
   <i class="bird e">🐦</i><i class="bird e" style="top:230px;animation-delay:-6s,-.4s;font-size:40px">🐦</i><i class="bus e">🚌</i>
   <div class="school">${UNIT.icon}</div><h1>${UNIT.word.split('').map((c,i)=>`<span style="animation-delay:${i*.12}s">${c}</span>`).join('')}</h1>
   <div class="tag">${UNIT.tag}</div>
   <div class="namebox"><span>What is your name?</span><input id="nm" maxlength="12" placeholder="Write your name" autocomplete="off" spellcheck="false"></div>
   <div id="nmNote"></div><button class="go" id="start">▶ Let's go!</button>`;
  const inp=$('#nm',node),note=$('#nmNote',node);
  inp.oninput=()=>{let v=inp.value.replace(/[^A-Za-z ]/g,'');if(v&&v[0]!==v[0].toUpperCase()){v=v[0].toUpperCase()+v.slice(1);note.textContent='✨ A name starts with an upper case letter!';sfx.ok()}inp.value=v;NAME=v.trim()};
  $('#start',node).onclick=()=>{sfx.win();say((NAME?`Hello, ${NAME}! `:'Hello! ')+UNIT.hello);go(1)};
}
function map(s,node){
  const first=p=>S.findIndex(x=>x.part===p);
  node.innerHTML=`<h1>${UNIT.mapTitle}</h1><div class="body"><div class="map"><svg viewBox="0 0 1460 600"><path class="road" d="M40 520 C160 520 200 440 300 420 C460 390 520 250 700 250 C880 250 900 440 1080 430 C1240 420 1300 260 1400 180"/><path class="dash" d="M40 520 C160 520 200 440 300 420 C460 390 520 250 700 250 C880 250 900 440 1080 430 C1240 420 1300 260 1400 180"/></svg>
    <div class="mbus"><span>🚌</span></div></div></div>`;
  const m=$('.map',node);
  [['a',300,390],['b',700,220],['c',1080,400],['f',1380,130,'🏆','Finish!','النهاية']].map(r=>r[0]==='f'?r:[...r,...UNIT.parts[r[0]]]).forEach(([p,x,y,e,t,ar])=>{
    const b=el('button','stn',`<b>${e}</b><span>${t}</span><small>${ar}</small>`);b.style.left=x+'px';b.style.top=y+'px';b.style.setProperty('--k',p==='f'?'#2fb36b':`var(--${p})`);
    b.onclick=()=>{sfx.win();go(p==='f'?S.length-1:first(p))};m.append(b)});
  node.dataset.part='a';
}
let fxRun=0;
function final(s,node){node.id='sF';
  node.innerHTML=`<canvas id="fx" width="1600" height="900"></canvas><div class="body"><div class="cert"><div class="cup">🏆</div><h2>Certificate of a Super Star</h2><div class="nm" id="cnm"></div><p>finished <span style="color:var(--a)">${UNIT.pill}</span></p><p id="tot"></p><div class="ar" id="totAr"></div></div></div>`;
  const cv=$('#fx',node),cx=cv.getContext('2d');let ps=[];
  const loop=id=>{if(id!==fxRun)return;cx.fillStyle='rgba(17,26,48,.22)';cx.fillRect(0,0,1600,900);
    if(Math.random()<.07){const x=rnd(150,1450),y=rnd(90,480),h=rnd(0,360);for(let k=0;k<46;k++){const a=rnd(0,6.28),v=rnd(1.5,7);ps.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,h})}tone(rnd(300,700),.25,'triangle',.03)}
    ps=ps.filter(p=>p.l>0);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.06;p.l-=.013;cx.fillStyle=`hsla(${p.h},95%,65%,${p.l})`;cx.beginPath();cx.arc(p.x,p.y,4,0,7);cx.fill()});requestAnimationFrame(()=>loop(id))};
  s.enter=()=>{$('#cnm').textContent=NAME||'Super Star';$('#tot').textContent=`⭐ ${stars} of ${TOTAL} stars`;
    $('#totAr').textContent=stars>=TOTAL*.8?'ممتاز! أنتِ نجمة الوحدة الأولى':stars>=TOTAL*.4?'أحسنتِ! عودي للأنشطة لتجمعي نجومًا أكثر':'بداية جميلة! جرّبي الأنشطة لتجمعي النجوم';
    sfx.win();say(`Well done${NAME?', '+NAME:''}! You are a super star!`);const id=++fxRun;loop(id)};
  s.leave=()=>{fxRun++};
}

/* ---------- mount ---------- */
document.title=UNIT.pill;$('.unit').textContent=UNIT.pill;if(UNIT.css)document.head.append(el('style','',UNIT.css));
const wrap=$('#slides');
S.forEach((s,n)=>{const node=el('section','slide');s.id=node.id='s'+n;s.node=node;if(s.part)node.dataset.part=s.part;
  if(s.type==='title')title(s,node);else if(s.type==='map')map(s,node);else if(s.type==='final')final(s,node);
  else{node.innerHTML=`<h1>${s.title}</h1>${s.tip?`<div class="tip">${s.tip}</div>`:''}<div class="body"></div>`;ENG[s.type](s,$('.body',node))}
  if(s.amb)amb(node,s.amb);wrap.append(node)});
const TOTAL=S.reduce((a,s)=>a+(s.max||0),0);
function go(n){n=Math.max(0,Math.min(S.length-1,n));if(S[cur].leave)S[cur].leave();cur=n;TOK++;try{speechSynthesis.cancel()}catch(e){}if(CLIP){try{CLIP.pause()}catch(e){}CLIP=null}
  const s=S[n];S.forEach((x,k)=>x.node.classList.toggle('on',k===n));
  $('#partLbl').textContent=s.part?'Part '+UNIT.parts[s.part][1]:'';$('#bar').style.visibility=n===0?'hidden':'visible';$('#nav').style.visibility=n===0?'hidden':'visible';
  $('#prev').disabled=n===0;const nx=$('#next');nx.disabled=n===S.length-1;nx.classList.remove('hint');
  const pc=n/(S.length-1)*100;$('#pfill').style.width=pc+'%';$('#pbus').style.left=pc+'%';$('#pnum').textContent=`${n+1} / ${S.length}`;
  $('#stage').classList.toggle('dark',s.type==='final');
  const rf=s.ref;$('#refs').innerHTML=rf?`<span class="rf sb${rf[2]!=='ab'?' on':''}">📘 Student Book ${rf[0]||'—'}</span><span class="rf ab${rf[2]!=='sb'?' on':''}">📗 Activity Book ${rf[1]||'—'}</span>`:'';
  const b=$('#bub');b.textContent=s.ar||'';b.style.display=s.ar?'':'none';b.classList.remove('new');void b.offsetWidth;b.classList.add('new');
  if(s.reset)s.reset();if(s.enter)s.enter();
}
$('#prev').onclick=()=>{sfx.tap();go(cur-1)};$('#next').onclick=()=>{sfx.tap();go(cur+1)};
$('#mapB').onclick=()=>go(1);$('#pip').onclick=()=>{pip('yay');sfx.ok()};
$('#muteB').onclick=e=>{MUTE=!MUTE;e.currentTarget.textContent=MUTE?'🔇':'🔊';if(MUTE)try{speechSynthesis.cancel()}catch(x){}};
$('#fsB').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}};
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowRight'||e.key==='PageDown')go(cur+1);if(e.key==='ArrowLeft'||e.key==='PageUp')go(cur-1)});
function fit(){K=Math.min(innerWidth/1600,innerHeight/900);$('#stage').style.transform=`scale(${K}) translate(-50%,-50%)`}
addEventListener('resize',fit);fit();go(0);
</script>
</body>
